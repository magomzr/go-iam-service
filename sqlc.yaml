version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_sql_as_comment: true
        sql_package: "pgx/v5"
