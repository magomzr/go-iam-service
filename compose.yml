services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam_secret
      POSTGRES_DB: iam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  iam:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      DATABASE_URL: postgres://iam:iam_secret@postgres:5432/iam_db?sslmode=disable
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_KEY_ID: v1
      ACCESS_TOKEN_MINUTES: 15
      REFRESH_TOKEN_DAYS: 7
      RATE_LIMIT_REQUESTS: 10
      RATE_LIMIT_WINDOW_S: 60
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M

  # UI admin — se agrega después
  # iam-ui:
  #   build:
  #     context: ./ui
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - iam
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.5"
  #         memory: 128M
  #       reservations:
  #         cpus: "0.1"
  #         memory: 64M

secrets:
  jwt_private_key:
    file: ./keys/private.pem
  jwt_public_key:
    file: ./keys/public.pem

volumes:
  postgres_data:
